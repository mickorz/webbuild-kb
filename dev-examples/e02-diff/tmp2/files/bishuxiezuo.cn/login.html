<title>登录 · 笔枢 Novelbuilt</title>
<style>
:root,[data-theme="light"]{
  --paper:#FEFCF8;--paper-2:#F8F4EB;--paper-3:#F1E9DA;--card:#FFFFFF;
  --ink:#221D16;--ink-2:#5E5447;--ink-3:#938979;
  --line:rgba(34,29,22,.10);--line-2:rgba(34,29,22,.055);
  --gold:oklch(0.70 0.125 70);--gold-deep:oklch(0.56 0.125 58);
  --gold-soft:oklch(0.92 0.045 78);--gold-wash:oklch(0.975 0.018 80);
  --terra:oklch(0.58 0.15 35);
  --shadow:rgba(34,29,22,.18);
}
[data-theme="dark"]{
  --paper:#17130E;--paper-2:#1F1A13;--paper-3:#2A2318;--card:#211B14;
  --ink:#F4EDE0;--ink-2:#BCB2A1;--ink-3:#897F6F;
  --line:rgba(244,237,224,.13);--line-2:rgba(244,237,224,.06);
  --gold:oklch(0.80 0.13 75);--gold-deep:oklch(0.84 0.115 74);
  --gold-soft:oklch(0.42 0.07 70);--gold-wash:oklch(0.27 0.04 72);
  --terra:oklch(0.72 0.15 38);
  --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;transition:background .5s,color .5s}
:root{--sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC",serif;--latin:"Newsreader",Georgia,serif;--ease:cubic-bezier(.2,.7,.2,1)}
a{color:inherit;text-decoration:none}
button{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}
.wrap{display:grid;grid-template-columns:1.05fr .95fr;height:100vh}

/* left brand panel */
.brandside{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--paper-2),var(--gold-wash) 70%,var(--paper-3));padding:54px 60px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.brandside::before{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(34,29,22,.03) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
.bs-top{display:flex;align-items:baseline;gap:11px;position:relative;z-index:2}
.bs-top .cn{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.04em}
.bs-top .en{font-family:var(--latin);font-style:italic;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)}
.bs-mid{position:relative;z-index:2}
.bs-mid h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,3vw,2.7rem);line-height:1.45;letter-spacing:-.01em;max-width:14em}
.bs-mid h1 em{font-style:normal;color:var(--gold-deep)}
.bs-mid .by{margin-top:22px;display:flex;align-items:center;gap:13px;color:var(--ink-3);font-size:14px}
.bs-mid .by .ln{width:32px;height:1px;background:var(--ink-3)}
.bs-foot{position:relative;z-index:2;font-family:var(--latin);font-style:italic;font-size:14px;color:var(--ink-3)}
/* world-state motif */
.motif{position:absolute;right:-90px;top:50%;transform:translateY(-50%);width:520px;height:520px;z-index:1;opacity:.85}
.motif .edge{stroke:var(--gold);stroke-width:1.2;fill:none;opacity:.5}
.motif .edge.live{stroke-dasharray:4 5;animation:flow 1.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.motif circle.sat{fill:var(--card);stroke:var(--gold-soft);stroke-width:1.5}
.motif circle.core{fill:var(--gold-wash);stroke:var(--gold);stroke-width:2}
.motif text{font-family:var(--sans);font-size:11px;fill:var(--ink-2);font-weight:500}
.motif .pulse{fill:var(--gold);animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}

/* right form panel */
.formside{display:flex;flex-direction:column;padding:30px 40px;position:relative;overflow-y:auto}
.fs-top{display:flex;align-items:center;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-3);transition:color .2s}
.back:hover{color:var(--ink)}
.tools{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;font-size:12.5px;font-weight:600;transition:all .2s}
.icon-btn:hover{border-color:var(--ink-3);color:var(--ink);background:var(--card)}
.formbox{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:380px;width:100%;margin:0 auto;padding:24px 0}
.tabs{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:30px;align-self:flex-start}
.tab{font-size:14px;padding:8px 20px;border:0;background:transparent;border-radius:8px;color:var(--ink-3);cursor:pointer;transition:all .2s;font-weight:500}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.formbox h2{font-family:var(--serif);font-weight:600;font-size:28px;margin-bottom:8px}
.formbox .sub{font-size:14px;color:var(--ink-2);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:7px;font-weight:500}
.field .inp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.field .inp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.field .inp svg{color:var(--ink-3);flex:none}
.field input{flex:1;border:none;outline:none;background:transparent;color:var(--ink);font-family:var(--sans);font-size:14.5px;padding:13px 0}
.field input::placeholder{color:var(--ink-3)}
.field .eye{display:grid;place-items:center;border:0;background:transparent;padding:4px;cursor:pointer;color:var(--ink-3)}
.row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 22px;font-size:13px}
.row{justify-content:flex-end}
.text-action{border:0;background:transparent;color:var(--gold-deep);font-weight:500;cursor:pointer}
.text-action:hover{text-decoration:underline;text-underline-offset:3px}
.btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:none;border-radius:11px;padding:15px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;transition:all .25s var(--ease)}
.btn-primary:hover{background:var(--gold-deep);transform:translateY(-1px);box-shadow:0 10px 24px -10px var(--gold-deep)}
.foot-note{text-align:center;font-size:13px;color:var(--ink-3);margin-top:26px}
.foot-note button{font-size:inherit;font-weight:600}
.legal{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:18px;line-height:1.6}
.legal a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.legal-consent{margin:2px 0 18px;font-size:12px;line-height:1.65;color:var(--ink-2)}
.legal-consent[hidden]{display:none}
.legal-consent label{display:flex;align-items:flex-start;gap:9px;cursor:pointer}
.legal-consent input{width:16px;height:16px;margin-top:2px;accent-color:var(--gold-deep);flex:none}
.legal-consent a{color:var(--gold-deep);text-decoration:underline;text-underline-offset:2px}
.auth-msg{min-height:22px;margin:14px 0 0;font-size:13px;color:var(--ink-3);line-height:1.5}
.auth-msg.error{color:var(--terra)}
.auth-msg.ok{color:var(--gold-deep)}
.btn-primary[disabled]{opacity:.68;cursor:not-allowed;transform:none;box-shadow:none}

/* ---- verification code input ---- */
.code-row{display:flex;gap:12px;margin-bottom:20px}
.code-cell{width:48px;height:52px;text-align:center;font-size:18px;font-weight:600;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-family:monospace;outline:none;flex-shrink:1}
.code-cell:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.code-sent{font-size:13px;color:var(--ink-2);text-align:center;margin-bottom:14px}
.code-sent strong{color:var(--ink)}
.resend-link{font-size:13px;color:var(--gold-deep);cursor:pointer;text-align:center;display:block;margin:12px auto 0;font-weight:500}
.resend-link:hover{text-decoration:underline}

/* ---- forgot password / step panel ---- */
.fp-back{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;font-size:13.5px;color:var(--ink-3);cursor:pointer;transition:color .2s;margin-bottom:10px}
.fp-back:hover{color:var(--ink)}
.fp-back svg{flex:none}
.fp-step{display:none}
.fp-step.active{display:block}
.fp-step .info{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:20px}

@media(max-width:860px){
  .wrap{grid-template-columns:1fr}
  .brandside{display:none}
  .formside{padding:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
function safeNext(){
  var raw='';
  try{ raw=new URLSearchParams(window.location.search).get('next')||''; }catch(e){}
  if(!raw) return '/console/console.html';
  try{
    var url=new URL(raw, window.location.origin);
    if(url.origin!==window.location.origin) return '/console/console.html';
    return url.pathname+url.search+url.hash;
  }catch(e){
    return raw.charAt(0)==='/' && raw.charAt(1)!=='/' ? raw : '/console/console.html';
  }
}
(function(){
  try {
    var tokens = JSON.parse(localStorage.getItem("lf_tokens") || "null");
    if (tokens && (tokens.access_token || tokens.accessToken)) {
      window.location.replace(safeNext());
    }
  } catch (e) {}
})();

let initialInviteCode='';
try{initialInviteCode=(new URLSearchParams(window.location.search).get('invite')||'').trim().toUpperCase();}catch(e){}
let initialSource='';
try{
  const candidate=(new URLSearchParams(window.location.search).get('source')||'').trim().toLowerCase();
  initialSource=/^[a-z0-9][a-z0-9_-]{0,31}$/.test(candidate)?candidate:'';
}catch(e){}
let mode=initialInviteCode?'signup':'login';
let lang=(window.NBSite ? window.NBSite.interfaceLanguage() : (localStorage.getItem('lf_clang')||localStorage.getItem('lf_lang')||'zh'));
const langBtn=document.getElementById('langBtn'), themeBtn=document.getElementById('themeBtn');

function apply(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const base=el.getAttribute('data-i18n');
    let key=base;
    if(mode==='signup'){
      if(base==='welcome')key='welcome_signup';
      if(base==='welcome_sub')key='welcome_signup_sub';
      if(base==='signin')key='signin_signup';
      if(base==='no_account')key='have_account';
      if(base==='signup_link')key='login_link';
    }
    if(d[key]!=null) el.innerHTML=d[key];
  });
  const loginTab=document.getElementById('tabLogin');
  const signupTab=document.getElementById('tabSignup');
  loginTab.classList.toggle('on',mode==='login');
  signupTab.classList.toggle('on',mode==='signup');
  loginTab.setAttribute('aria-selected',String(mode==='login'));
  signupTab.setAttribute('aria-selected',String(mode==='signup'));
  loginTab.tabIndex=mode==='login'?0:-1;
  signupTab.tabIndex=mode==='signup'?0:-1;
  document.getElementById('nameField').hidden=mode!=='signup';
  document.getElementById('inviteField').hidden=mode!=='signup';
  document.getElementById('displayName').placeholder=d.display_name_placeholder;
  document.getElementById('legalConsent').hidden=mode!=='signup';
  document.getElementById('legalAccepted').required=mode==='signup';
  document.getElementById('loginLegal').hidden=mode==='signup';
  document.getElementById('pw').setAttribute('autocomplete',mode==='login'?'current-password':'new-password');
  langBtn.textContent=lang==='zh'?'EN':'中';
  langBtn.setAttribute('aria-label',lang==='zh'?'Switch to English':'切换到中文');
  const passwordVisible=document.getElementById('pw').type==='text';
  const eye=document.getElementById('eye');
  eye.setAttribute('aria-pressed',String(passwordVisible));
  eye.setAttribute('aria-label',lang==='zh'?(passwordVisible?'隐藏密码':'显示密码'):(passwordVisible?'Hide password':'Show password'));
  const currentTheme=document.documentElement.getAttribute('data-theme')||'light';
  themeBtn.setAttribute('aria-label',lang==='zh'?(currentTheme==='dark'?'切换到浅色主题':'切换到深色主题'):(currentTheme==='dark'?'Switch to light theme':'Switch to dark theme'));
  document.querySelector('.tabs').setAttribute('aria-label',lang==='zh'?'账户入口':'Account access');
  document.getElementById('codeRow').setAttribute('aria-label',lang==='zh'?'验证码':'Verification code');
  document.querySelectorAll('#codeRow .code-cell').forEach((cell,index)=>{
    cell.setAttribute('aria-label',lang==='zh'?`验证码第 ${index+1} 位`:`Verification code digit ${index+1}`);
  });
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
}
function setLang(l){lang=l;if(window.NBSite)window.NBSite.rememberLanguage(l);else{localStorage.setItem('lf_lang',l);localStorage.setItem('lf_clang',l);}apply();}
langBtn.addEventListener('click',()=>setLang(lang==='en'?'zh':'en'));

function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);localStorage.setItem('lf_theme',t);
  themeBtn.innerHTML=t==='dark'
    ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>';
  themeBtn.setAttribute('aria-label',lang==='zh'?(t==='dark'?'切换到浅色主题':'切换到深色主题'):(t==='dark'?'Switch to light theme':'Switch to dark theme'));
}
themeBtn.addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

function setMode(nextMode,focusTab){
  mode=nextMode;
  apply();
  if(focusTab)document.getElementById(mode==='login'?'tabLogin':'tabSignup').focus();
}
document.getElementById('tabLogin').addEventListener('click',()=>setMode('login'));
document.getElementById('tabSignup').addEventListener('click',()=>setMode('signup'));
document.querySelector('.tabs').addEventListener('keydown',event=>{
  if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;
  event.preventDefault();
  setMode(mode==='login'?'signup':'login',true);
});
document.getElementById('switchLink').addEventListener('click',()=>setMode(mode==='login'?'signup':'login',true));
document.getElementById('eye').addEventListener('click',()=>{
  const p=document.getElementById('pw');
  p.type=p.type==='password'?'text':'password';
  apply();
});

const API_BASE=(window.NBSite ? window.NBSite.apiBase() : localStorage.getItem('lf_api_base')||'');
const LEGAL_TERMS_VERSION='2026-09-20';
const LEGAL_PRIVACY_VERSION='2026-10-01';
const authMsg=document.getElementById('authMsg');
const submitBtn=document.getElementById('submitBtn');

function showMsg(text,type){
  authMsg.textContent=text||'';
  authMsg.className='auth-msg'+(type?' '+type:'');
}
function saveTokens(tokens){
  localStorage.setItem('lf_tokens',JSON.stringify(tokens));
  localStorage.setItem('novelbuilt.tokens',JSON.stringify(tokens));
}
async function registrationAnalytics(){
  if(!window.LFPrivacy) return null;
  await window.LFPrivacy.ready();
  return window.LFPrivacy.collection();
}
async function api(path,body,headers){
  let res;
  try{
    res=await fetch(API_BASE+path,{
      method:'POST',
      headers:Object.assign({'Content-Type':'application/json','Accept':'application/json'},headers||{}),
      body:JSON.stringify(body)
    });
  }catch(error){
    throw new Error(window.LF_AUTH.errorMessage(lang,0,null));
  }
  if(!res.ok){
    let detail=null;
    try{
      const data=await res.json();
      detail=data.detail||data.message||null;
    }catch(e){}
    throw new Error(window.LF_AUTH.errorMessage(lang,res.status,detail));
  }
  return res.json();
}
function enter(){window.location.href=safeNext();}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  showMsg('',null);
  submitBtn.disabled=true;
  try{
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    const displayName=document.getElementById('displayName').value.trim();
    if(mode==='signup'){
      // Step 1: init registration — send verification code
      const inviteCode=document.getElementById('inviteCode').value.trim().toUpperCase();
      const analyticsConsent=await registrationAnalytics();
      const result=await api('/api/auth/register/init',{email,password,display_name:displayName||null,invite_code:inviteCode||null,source:analyticsConsent?(initialSource||null):null,landing_path:analyticsConsent?window.location.pathname:null,legal_accepted:document.getElementById('legalAccepted').checked,terms_version:LEGAL_TERMS_VERSION,privacy_version:LEGAL_PRIVACY_VERSION},analyticsConsent?{'X-LF-Analytics-Consent':analyticsConsent}:null);
      svEmail=email;
      svPassword=password;
      svRegistrationToken=result.registration_token;
      document.getElementById('svSentEmail').textContent=result.masked_email||email;
      showSvView();
    }else{
      const tokens=await api('/api/auth/login',{email,password});
      saveTokens(tokens);
      showMsg(lang==='zh'?'登录成功，正在进入控制台...':'Signed in. Opening console...','ok');
      setTimeout(enter,220);
    }
  }catch(err){
    showMsg(err.message||String(err),'error');
  }finally{
    submitBtn.disabled=false;
  }
});
// ---- forgot password flow ----
const normalView=document.getElementById('normalView');
const fpView=document.getElementById('fpView');
const forgotLink=document.getElementById('forgotLink');
const fpBack=document.getElementById('fpBack');
const fpForm=document.getElementById('fpForm');
const fpSubmitBtn=document.getElementById('fpSubmitBtn');
const fpMsg=document.getElementById('fpMsg');
const fpMsg2=document.getElementById('fpMsg2');
const fpResendBtn=document.getElementById('fpResendBtn');
const fpEmail=document.getElementById('fpEmail');

function showFpView(){
  normalView.style.display='none';
  fpView.style.display='block';
  document.getElementById('fpStep1').classList.add('active');
  document.getElementById('fpStep2').classList.remove('active');
  fpEmail.value='';
  showFpMsg('',null);
  showFpMsg2('',null);
  fpEmail.focus();
}
function hideFpView(){
  normalView.style.display='';
  fpView.style.display='none';
  forgotLink.focus();
}
function showFpMsg(text,type){
  fpMsg.textContent=text||'';
  fpMsg.className='auth-msg'+(type?' '+type:'');
}
function showFpMsg2(text,type){
  fpMsg2.textContent=text||'';
  fpMsg2.className='auth-msg'+(type?' '+type:'');
}

forgotLink.addEventListener('click',showFpView);
fpBack.addEventListener('click',hideFpView);

fpForm.addEventListener('submit',async (e)=>{
  e.preventDefault();
  showFpMsg('',null);
  fpSubmitBtn.disabled=true;
  const email=fpEmail.value.trim();
  try{
    await api('/api/auth/password/reset/request',{email});
    document.getElementById('fpStep1').classList.remove('active');
    document.getElementById('fpStep2').classList.add('active');
    document.getElementById('fpSentEmail').textContent=email;
  }catch(err){
    showFpMsg(err.message||String(err),'error');
  }finally{
    fpSubmitBtn.disabled=false;
  }
});

fpResendBtn.addEventListener('click',async ()=>{
  showFpMsg2('',null);
  fpResendBtn.disabled=true;
  const email=fpEmail.value.trim()||document.getElementById('fpSentEmail').textContent;
  try{
    await api('/api/auth/password/reset/request',{email});
    showFpMsg2(lang==='zh'?'如果该邮箱已注册，重置链接已重新发送。':'If the email is registered, the reset link has been sent again.','ok');
  }catch(err){
    showFpMsg2(err.message||String(err),'error');
  }finally{
    fpResendBtn.disabled=false;
  }
});

// ---- signup verification code flow ----
var svEmail='';
var svPassword='';
var svRegistrationToken='';
var svView=document.getElementById('svView');
var svBack=document.getElementById('svBack');
var svVerifyBtn=document.getElementById('svVerifyBtn');
var svResendLink=document.getElementById('svResendLink');
var svMsg=document.getElementById('svMsg');
var codeRow=document.getElementById('codeRow');

function showSvView(){
  normalView.style.display='none';
  svView.style.display='block';
  document.querySelectorAll('#codeRow .code-cell').forEach(function(c,i){c.value='';if(i===0)c.focus();});
  showSvMsg('',null);
  svVerifyBtn.disabled=false;
}
function hideSvView(){
  svPassword='';
  svRegistrationToken='';
  normalView.style.display='';
  svView.style.display='none';
  document.getElementById('tabSignup').focus();
}
function showSvMsg(text,type){
  svMsg.textContent=text||'';
  svMsg.className='auth-msg'+(type?' '+type:'');
}
function getCode(){
  var code='';
  document.querySelectorAll('#codeRow .code-cell').forEach(function(c){code+=c.value;});
  return code;
}

// Auto-advance code cells
codeRow.addEventListener('input',function(e){
  if(e.target && e.target.classList.contains('code-cell')){
    e.target.value=e.target.value.replace(/[^0-9]/g,'');
    if(e.target.value){
      var next=e.target.nextElementSibling;
      if(next && next.classList.contains('code-cell')) next.focus();
    }
  }
});
codeRow.addEventListener('keydown',function(e){
  if(e.target && e.target.classList.contains('code-cell')){
    if(e.key==='Backspace' && !e.target.value){
      var prev=e.target.previousElementSibling;
      if(prev && prev.classList.contains('code-cell')){prev.focus();prev.value='';}
    }
  }
});
// Paste entire code at once
codeRow.addEventListener('paste',function(e){
  e.preventDefault();
  var text=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
  var cells=document.querySelectorAll('#codeRow .code-cell');
  for(var i=0;i<Math.min(text.length,cells.length);i++){
    cells[i].value=text[i];
  }
  var lastIdx=Math.min(text.length,cells.length)-1;
  if(lastIdx>=0) cells[lastIdx].focus();
});

svBack.addEventListener('click',hideSvView);

svVerifyBtn.addEventListener('click',async function(){
  showSvMsg('',null);
  var code=getCode();
  if(code.length<6){showSvMsg(lang==='zh'?'请输入 6 位验证码。':'Please enter the 6-digit code.','error');return;}
  svVerifyBtn.disabled=true;
  try{
    var analyticsConsent=await registrationAnalytics();
    var tokens=await api('/api/auth/register/verify',{
      email:svEmail,
      code:code,
      password:svPassword,
      registration_token:svRegistrationToken,
      legal_accepted:true,
      terms_version:LEGAL_TERMS_VERSION,
      privacy_version:LEGAL_PRIVACY_VERSION
    },analyticsConsent?{'X-LF-Analytics-Consent':analyticsConsent}:null);
    svPassword='';
    svRegistrationToken='';
    saveTokens(tokens);
    localStorage.setItem('lf_theme','light');
    showSvMsg(lang==='zh'?'验证成功，正在进入控制台...':'Verified. Opening console...','ok');
    setTimeout(enter,220);
  }catch(err){
    showSvMsg(err.message||String(err),'error');
    svVerifyBtn.disabled=false;
  }
});

svResendLink.addEventListener('click',async function(){
  showSvMsg('',null);
  svResendLink.disabled=true;
  try{
    var result=await api('/api/auth/register/resend-code',{
      email:svEmail,
      registration_token:svRegistrationToken
    });
    svRegistrationToken=result.registration_token||svRegistrationToken;
    showSvMsg(lang==='zh'?'验证码已重新发送。':'Verification code sent again.','ok');
  }catch(err){
    showSvMsg(err.message||String(err),'error');
  }finally{
    svResendLink.disabled=false;
  }
});

document.getElementById('inviteCode').value=initialInviteCode;
setTheme(localStorage.getItem('lf_theme')||'light');
apply();
</script>
