a4b-376b-4b0d-92c1-2e4bc49bef8b\",\"status\":\"ready\",\"dimensions\":{\"existence\":{\"death\":\"死亡分为生理性终结与气血枯竭。武者死亡瞬间，体内残留内力失控逸散，导致身体水分与有机物迅速流失，尸体在数分钟内风化为黑色干瘪状，散发强烈铁锈味，此现象称为“风化”。因此传统土葬已消失，普遍采用火化后装入密封骨灰盒，或直接投入城市有机循环系统制成肥料。对于欠下“寿命贷”的违约者，武道联盟执法队会执行“抽髓刑”，强行抽取其剩余精气抵债，过程极其痛苦，最终留下一具完全碳化的空壳。\",\"essence\":\"气劲即寿命，透支折阳寿，死后化风干黑尸。\",\"calendar\":\"采用新历（NL），以《私斗公约》签署之年为元年。一年365天，分12个月，每月30或31天。因高层武者战斗常导致局部气候异常（热浪或骤冷），民间不再依赖传统节气农时，而是依据武道联盟发布的“气血潮汐表”安排高风险活动。重大节日包括“清算日”（年终债务结算与寿命贷复核）和“燃血祭”（纪念第一次气血战争中的死者）。\",\"lifespan\":\"人类基准寿命75-80岁，但受修为与资源影响极大。锻体境凡人若无透支，寿命同常人；通脉境武者因常年维持高强度内息运转，细胞活性加速消耗，自然寿命降至60岁左右，若频繁透支则可能早衰至40岁。宗师境以上者通过吞噬高能精华可延寿至120-150岁，但每次突破基因锁或施展禁术均会永久性扣除数年阳寿。大宗师虽理论可达200岁，但因长期处于高负荷状态，多死于脏器衰竭或走火入魔。噬元兽寿命极短，通常仅3-5年，因其代谢极快，旨在快速积累能量后被猎杀。\",\"disease_and_birth\":\"常见疾病多为“气血病”，如经脉硬化、内脏溶血、辐射变异症。治疗手段依赖高纯度灵药注射或移植健康武者的器官片段，普通西医仅能处理外伤。新生儿存活率在天枢区接近100%，但在荒弃带不足60%，因母体营养不良或环境辐射导致胎儿畸形。出生率整体低迷，因养育高阶后代需巨额气血投入，底层民众倾向于少生或不生。部分极端组织尝试“血脉改造”婴儿，虽能提高修炼天赋，但致死率极高且易引发精神错乱。\"},\"society\":{\"races\":[{\"name\":\"人类\",\"traits\":\"具备经脉系统，可修炼内力，但受基因锁与气血守恒限制\",\"population\":\"绝对主体\",\"social_status\":\"依据武道境界与资产划分为三六九等\"},{\"name\":\"噬元兽\",\"traits\":\"高能量生物，血肉蕴含丰富元气，具有攻击性与变异特征\",\"population\":\"主要分布于荒弃带与城市下水道\",\"social_status\":\"被狩猎的资源/底层武者的食物来源\"}],\"forces\":[{\"name\":\"武道联盟理事会\",\"type\":\"官方霸权组织\",\"goals\":[\"维持都市表面秩序与资本流通稳定\",\"垄断高阶灵药与正统功法解释权\",\"清除不可控的野生强者与禁忌实验\"],\"methods\":[\"控制灵药供应链与银行信贷体系\",\"部署自动化杀气监控网络\",\"派遣宗师级‘肃清者’执行定点抹杀\"],\"base_of_power\":\"天枢·长生塔\"},{\"name\":\"铁骨会\",\"type\":\"地下黑帮势力\",\"goals\":[\"垄断地下黑市的高能生物精华交易\",\"庇护非法武者与逃避债务的透支者\",\"渗透缓冲区商业网络以洗钱\"],\"methods\":[\"经营异兽屠宰场与廉价补剂工厂\",\"提供高利贷式的‘气血借贷’服务\",\"利用巷道地形进行游击式私斗\"],\"base_of_power\":\"九龙城寨·旧改区\"},{\"name\":\"猎命者同盟\",\"type\":\"松散互助联盟\",\"goals\":[\"在辐射与怨念环境中生存并获取变异资源\",\"反抗武道联盟的资源封锁\",\"寻找解除血脉基因锁的禁忌秘方\"],\"methods\":[\"组队猎杀高危变异噬元兽\",\"交换未经注册的野路子功法\",\"通过自残式透支换取短期爆发力\"],\"base_of_power\":\"第零号禁区\"}],\"essence\":\"武道联盟执掌天枢秩序，铁骨会垄断黑市气血，散修猎命者在废墟中挣扎求生。\",\"class_structure\":\"基于‘气血账面’的金字塔结构。顶层为掌握灵药培育与高阶功法的财阀世家（大宗师/宗师）；中层为受雇于财阀或帮派的通脉境武者、技术官僚；底层为锻体境平民、非法改造者及依赖合成液维持生命的贫民。阶层流动极度依赖高能资源获取，透支折寿是跨越阶层的常见代价。\",\"force_relations\":[{\"source\":\"武道联盟理事会\",\"target\":\"铁骨会\",\"relation\":\"监管与共生\",\"tension_point\":\"联盟默许铁骨会处理低端废弃武者以减轻财政负担，但严禁其触及灵药核心专利与大规模杀伤性武器交易\"},{\"source\":\"武道联盟理事会\",\"target\":\"猎命者同盟\",\"relation\":\"敌对\",\"tension_point\":\"猎命者常从禁区带回未登记的变异资源冲击市场，且其成员多为联盟通缉的禁忌实验幸存者\"},{\"source\":\"铁骨会\",\"target\":\"猎命者同盟\",\"relation\":\"竞争与合作\",\"tension_point\":\"铁骨会压价收购猎命者从禁区带回的高危素材，同时猎命者依赖铁骨会的渠道将赃物变现，双方常在交易价格与货源真实性上发生暴力冲突\"}],\"political_system\":\"表面为现代法治社会，实则实行‘双轨制’治理。对普通人适用民法与刑法；对武者适用《私斗公约》与武道联盟律法。武道联盟理事会拥有最高裁决权，其执法队‘肃清者’有权在杀气显化时当场格杀违规者。地方政府仅负责基础设施维护与非武者治安，对高阶武力冲突保持中立。\",\"power_visibility\":\"权力体现为对‘气温’与‘信号’的控制。高层区域恒温如春，信号满格；底层区域随帮派火拼频繁出现局部结霜与通讯中断。普通人通过观察街头风干黑尸的清理速度判断当前治安状况：若尸体堆积，说明联盟执法力下降，黑帮势力抬头。高阶武者路过时，周围玻璃结霜、手机失灵的现象是移动的权力警示牌。\"},\"history_culture\":{\"customs\":\"社会普遍存在‘气血焦虑’。见面问候常涉及对方气色与近期补给情况。葬礼极简，因尸体迅速风化，多采用骨灰盒安置或直接转化为有机肥料。流行‘补剂社交’，高档宴席以分享稀有异兽部位为荣。街头常见‘静默区’标识，提醒路人此处可能有高手过境，需保持安静以免干扰杀气感知。\",\"economy\":\"双重货币体系。法币用于日常民用消费；‘血点’（基于标准单位气血能量发行的信用点数）是武者间的硬通货，与异兽肉、灵药挂钩。银行提供‘寿命贷’，允许武者预支未来生命力购买当前急需的资源，违约者将被强制抽取精气抵债。黑市流通未经提纯的原始兽血与禁忌改造手术服务。\",\"essence\":\"大枯竭后的账本纪元，每一次呼吸都是对生命的借贷。\",\"religions\":[{\"name\":\"长生教\",\"core_belief\":\"肉体是容器，气血是燃料。主张通过极端节制与精准计算延长寿命，视过度挥霍内力为亵渎。\",\"follower_scope\":\"天枢区高层、财阀家族、资深宗师\"},{\"name\":\"燃血宗\",\"core_belief\":\"刹那即永恒。认为生命意义在于燃烧气血换取极致力量，推崇在壮年巅峰期透支而死，反对苟延残喘。\",\"follower_scope\":\"猎命者同盟、地下死士、激进派散修\"}],\"daily_slice\":\"清晨，老陈在九龙城寨的狭窄公寓醒来，先吞下一支廉价的合成营养液压制胃部的灼烧感。他是锻体中期的保安，昨晚为保护雇主挡了一拳，导致右臂经脉微损。上班途中，他避开几个正在结霜的巷口，那是通脉境混混在收保护费。午餐是一份打折的鼠肉干，虽然腥臭但能补充少量元气。下午工作时，远处传来玻璃碎裂声和手机信号中断的杂音，老陈立刻趴下装死，直到那股冰冷的杀意散去。下班后，他去黑市当掉了祖传的一块玉佩，换了两支高纯度恢复剂，只为今晚能睡个安稳觉，不梦见自己干枯风化的尸体。\",\"major_events\":[{\"era\":\"旧历末期\",\"event\":\"灵脉断绝与大枯竭\",\"lasting_impact\":\"天地游离灵气消散，传统修仙体系崩溃。人类发现唯有吞噬高能生物或掠夺他人精气方可维持修为，武道从修身养性异化为资源掠夺战，确立了‘气血即货币’的残酷底层逻辑。\"},{\"era\":\"新历元年\",\"event\":\"第一次气血战争与《私斗公约》签署\",\"lasting_impact\":\"几位即将突破大宗师的强者因过度透支引发城市级热力爆炸，导致数百万平民死亡。幸存的财阀与宗门意识到无序杀戮将摧毁劳动力基础，遂在天枢区签署公约，划定平民保护区，确立双轨制法律，将暴力限制在武者阶层内部。\"},{\"era\":\"新历三十年\",\"event\":\"基因锁破解与异兽驯化工程\",\"lasting_impact\":\"武道联盟垄断了高阶功法的血脉适配技术，同时成功建立噬元兽养殖场。这标志着武力资源从‘野外狩猎’转向‘工业化生产’，财阀通过控制灵药与异兽肉供应链，彻底固化了社会阶级，散修生存空间被压缩至荒弃带。\"}]},\"information\":{\"essence\":\"杀气即静默，信号随热浪断裂，天枢网只传账单不传真相。\",\"info_speed\":\"数字信息在天枢区光纤网络中近乎实时传输，但在缓冲区与荒弃带，因武者战斗引发的电磁干扰与物理破坏，消息传递严重滞后。重大武道事件（如宗师陨落）首先通过“杀气显化”导致的局部通讯中断被感知，随后经由地下黑市的口耳相传或加密短波在数小时内扩散至全城。跨区域消息若需穿越不同财阀领地，往往需要数天时间进行人工中转与验证，以防虚假战报引发市场动荡。\",\"info_barriers\":\"武道联盟是最高信息垄断者，通过“肃清者”算法实时监控全网关键词，任何涉及“基因锁破解”、“大宗师弱点”或“寿命贷内幕”的信息会被瞬间屏蔽并溯源定位。封锁手段包括物理切断区域光纤、释放广域电磁脉冲干扰非法通讯，以及对知情者实施“社会性死亡”或肉体抹杀。铁骨会则控制着底层信息流，通过散布真假难辨的黑市情报操纵异兽肉价格，并利用巷道迷宫阻断执法队的追踪信号。猎命者同盟利用第零号禁区的辐射干扰天然屏障，建立独立的模拟信号电台网络，传播反抗言论与禁忌实验数据。\",\"rumor_and_truth\":\"信息失真主要源于“杀气干扰”与“利益操纵”。当强者交战时，周边电子设备失灵，目击者只能凭借模糊的感官记忆描述战况，导致谣言滋生，如将某位宗师的战术撤退渲染为重伤逃窜。常见误解包括认为“合成营养液可完全替代异兽肉”（实为慢性毒药，加速经脉硬化），以及相信“长生教能永生”（实则通过吞噬他人精气延寿）。财阀利用这些误解，故意泄露虚假的“平价灵药”消息诱导底层武者透支购买劣质产品，从而回收其剩余价值。真相往往隐藏在尸体风化的速度与方向中，只有经验丰富的老猎手能从中解读出真实的死因与凶手境界。\",\"knowledge_medium\":\"知识载体呈现极端二元化。高阶功法、灵药配方及血脉解锁技术存储在武道联盟的“天枢云”中，采用生物密钥（DNA+内息波动）多重加密，仅限理事会成员访问，物理备份存放于长生塔深层金库。中低阶武技以全息投影教程或神经植入芯片形式在黑市流通，但常夹带精神污染陷阱。普通人接触的知识仅限于《私斗公约》解读、基础锻体操以及由财阀控制的媒体发布的 sanitized 新闻。历史真相被重构，大枯竭前的文明细节被视为禁忌，相关纸质书籍已被焚毁，仅存于猎命者同盟的口述记忆中。\"},\"core_laws\":{\"axioms\":[{\"cost\":\"每次施展超出日常代谢的内力，需消耗等价的生物质或自身细胞活性，表现为极度饥饿或早衰。\",\"name\":\"能量守恒与转化律\",\"boundary\":\"无法在无补给情况下无限战斗，断粮即废人。\",\"statement\":\"内力并非凭空产生，必须通过摄入高能物质或掠夺他人精气来补充，体内存量有严格上限。\",\"enforcement\":\"违背者身体会自动崩溃，出现溶血、脏器溶解等生理性惩罚。\"},{\"cost\":\"暴露位置与意图，失去偷袭优势。\",\"name\":\"杀气显化原则\",\"boundary\":\"仅限具备明确杀伤意图时触发，无意识的情绪波动不在此列。\",\"statement\":\"当武者意念锁定杀机时，周围空气温度会骤降，电子设备会出现信号干扰，此现象不可隐藏。\",\"enforcement\":\"天道规则层面的物理反馈，无法通过功法屏蔽。\"},{\"cost\":\"理智丧失，沦为只知杀戮的野兽。\",\"name\":\"血脉共鸣限制\",\"boundary\":\"基础锻体法门无此限制，仅限宗师级以上的秘传绝学。\",\"statement\":\"高阶武学具有基因锁，非特定血脉或经过残酷改造者强行修炼会导致精神错乱。\",\"enforcement\":\"神经系统不可逆损伤，现代医学无法治愈。\"}],\"taboos\":[\"严禁在平民密集区使用大范围杀伤性武技，违者将被武道联盟联合抹杀。\",\"禁止抽取未成年人精气用于修炼，此为全江湖公敌，人人得而诛之。\",\"不可试图通过机械义肢完全替代肉体修炼，机械无法承载高浓度内力，会引发爆炸。\"],\"essence\":\"气劲即货币，透支则折寿，江湖是建立在气血账本上的暴力金融体系。\",\"power_system\":\"力量来源为人体先天元气与后天摄取的高能生物精华（如异兽肉、灵药）。等级划分为：锻体（物理极限）、通脉（内息外放）、宗师（气场干涉现实）、大宗师（一人敌国）。使用代价为“气血亏空”，过度使用会导致器官衰竭或寿命锐减。边界限制在于物理法则依然有效，热武器对低阶武者有绝对压制力，但高阶武者可通过感知危险提前规避。社会组织形态表面为现代都市，实则由几大武道财阀和地下宗门控制，法律仅约束普通人，武者间的纠纷遵循“私斗公约”。\",\"power_manifestation\":\"内力运转时，皮肤表面会浮现暗红色血管纹路，伴随低沉的骨骼摩擦声。出招时空气产生肉眼可见的热浪扭曲，强者周身环绕微弱的电离光晕。受伤后血液呈黑色粘稠状，散发铁锈味。死亡瞬间，尸体会迅速干瘪风化，仿佛被抽干了所有水分。\"},\"space_time\":{\"era\":\"近未来赛博武侠时代。科技水平接近2050年，互联网与物联网普及，但武者在网络上的活动受到严格监控。交通以磁悬浮列车与私人飞行器为主，但高阶武者更倾向于轻功穿梭于楼宇之间。通信方式除常规数字通讯外，存在基于内息波动的加密传音手段，仅限通脉境以上使用。\",\"ecology\":\"气候受大型内力战斗影响，局部地区常出现反常的热浪或低温区。原生野生动物已基本灭绝，取而代之的是适应高能量环境的“噬元兽”，其血肉成为武者主要补给来源。城市绿化多为转基因灵植，能微弱吸收空气中的游离气血。资源分布极度不均，高能灵药被财阀垄断，底层武者依赖合成营养液与猎杀流浪异兽维持修为。\",\"essence\":\"霓虹灯下血气翻涌，武道财阀割据的巨型都市丛林。\",\"world_layout\":\"世界表象为高度发达的现代超级都市群，但空间结构依“气血浓度”呈同心圆式分层。核心区域为“天枢区”，由几大武道财阀总部占据，拥有最高浓度的灵药培育基地与无菌修炼室；中层为“缓冲区”，普通市民与低阶武者混居，商业繁盛但秩序混乱；外围是“荒弃带”，充斥着未经驯化的异兽与非法斗场。城市地下隐藏着庞大的“黑市经络”，通过废弃地铁与排水系统连接，是地下宗门交易高能生物精华的秘密通道。地表建筑普遍加固，以承受宗师级战斗产生的冲击波。\",\"key_locations\":[{\"name\":\"天枢·长生塔\",\"risk\":\"严禁私斗，监控覆盖率达100%，任何杀气显化都会触发自动防御系统。\",\"feature\":\"武道联盟总部所在地，空气中弥漫着经过过滤的高纯度灵气，恒温恒湿，无尘埃。\",\"terrain\":\"人工岛屿，超高层建筑群\",\"controlling_force\":\"武道联盟理事会\"},{\"name\":\"九龙城寨·旧改区\",\"risk\":\"抢劫频发，常有低阶武者因透支过度当街暴毙，尸体风化迅速需及时清理。\",\"feature\":\"地下黑市中心，遍布售卖异兽肉串与劣质补剂的摊位，霓虹招牌闪烁，声波嘈杂。\",\"terrain\":\"高密度老旧居民楼，巷道狭窄曲折\",\"controlling_force\":\"地下帮派‘铁骨会’\"},{\"name\":\"第零号禁区\",\"risk\":\"进入者极易遭受精神污染，血脉共鸣失控风险极大，常见理智丧失的狂化武者游荡。\",\"feature\":\"曾发生大宗师级决战，残留的高浓度怨念与辐射导致电子设备失灵，异兽变异程度极高。\",\"terrain\":\"被能量屏障封锁的工业废墟\",\"controlling_force\":\"无人管辖，散修猎命者的乐园\"}],\"environment_texture\":\"空气常年带有淡淡的铁锈味与臭氧味，那是血液挥发与电离光晕交织的气息。夜晚的都市被霓虹灯染成紫红色，阴影中潜伏着窥视的目光。街头随处可见快速风化的黑色干尸被清洁机器人扫走，留下白色粉末痕迹。高档餐厅飘出异兽烤肉的焦香，而巷尾则弥漫着廉价补剂刺鼻的化学甜味。每当强者路过，周围温度骤降，玻璃窗结霜，手机信号中断，行人本能地屏住呼吸。\"}},\"cached\":true,\"cached_at\":\"2026-11-28T02:54:55.386526Z\"},\"characters\":[{\"name\":\"陈烬\",\"true_name\":\"陈烬\",\"role\":\"主角\",\"gender\":\"男\",\"age\":\"24岁\",\"aliases\":[\"拾荒者\",\"灰烬\"],\"surface_goal\":\"偿还巨额寿命贷，摆脱清道夫的底层身份，获得自由生存的权利。\",\"deep_desire\":\"被确认为一个有尊严的“人”，而非仅仅是一个能转化能量的容器或工具。\",\"deep_fear\":{\"fear\":\"在吞噬过度中彻底丧失人性，变成只知进食的怪物，或者在还清债务前因能量反噬而枯竭死亡。\",\"source\":\"目睹无数同行因无法控制怨念而尸变，以及鬼医暗示他最终可能沦为实验废品的警告。\"},\"secrets\":{\"content\":\"他在风化尸骸时，不仅吸收了气血，还意外保留了部分死者生前的记忆碎片和情感残响，这让他时常陷入幻觉，且他的修炼速度远超常理是因为他在无意识中通过共情化解了怨念，而非单纯压制。\",\"who_knows\":[],\"who_doesnt_know_but_should\":[\"鬼医\",\"霍天枢\"],\"exposure_consequence\":\"鬼医会将他解剖以研究这种罕见的“良性转化”机制；霍天枢会视他为破坏能量守恒定律的异端，直接抹杀或囚禁进行更残酷的实验。\"},\"bottom_line\":{\"condition\":\"无辜者（特别是同样在底层挣扎、未主动作恶的弱者）被当作纯粹的消耗品随意牺牲。\",\"source\":\"自己曾是被随意牺牲的孤儿，对弱者的痛苦有切肤之痛，这是他与冷血财阀的本质区别。\",\"reaction_when_crossed\":\"即使违背利益最大化原则，也会不惜暴露位置、透支寿命进行报复性清算，陷入非理性的狂暴状态。\"},\"traumas\":{\"wound\":\"十岁时，为了换取一块过期营养膏，被迫亲手风化了相依为命的盲眼阿婆的尸体，那是他第一次意识到在这个世界，亲情在生存面前毫无价值。\",\"trigger\":\"看到老年人或弱势群体被强者无视、践踏，或闻到类似阿婆尸体风化时的特殊气味。\",\"stress_response\":\"手部不受控制地颤抖，产生强烈的呕吐感，随后转化为极端的攻击欲，试图通过毁灭眼前的高阶强者来宣泄罪恶感。\",\"impact_on_behavior\":\"对老年弱者表现出异常的温柔和保护欲，但在战斗中倾向于使用最残忍、最彻底的风化手段摧毁敌人，以此潜意识里惩罚当年的自己。\"},\"contradictions\":{\"conflicting_elements\":\"渴望通过吞噬变强以打破阶级壁垒 vs 恐惧吞噬行为本身会让自己变成所憎恨的剥削者同类。\",\"source\":\"世界观中的“能量守恒与转化律”迫使底层人必须掠夺才能生存，但这与他内心残留的道德良知和人性的温暖需求相悖。\",\"possible_direction\":\"若走向和解，他将找到一种不依赖掠夺的共生进化之路；若走向崩溃，他将彻底拥抱虚无主义，成为比霍天枢更可怕的掠食者。\"},\"arc_description\":{\"growth_direction\":\"从“孤独的拾荒者”成长为“新秩序的建立者”，证明力量不必源于剥削，他可以重新定义能量转化的规则，带领底层人走出零和博弈的困境。\",\"corruption_direction\":\"成为“新的霍天枢”，认为只有绝对的力量和冷酷的计算才能终结混乱，最终坐在理事长的位置上，冷漠地注视着新一代的清道夫如蝼蚁般死去。\",\"key_choice\":\"当红绫面临生死危机，而解救她的唯一方法是吸收大量无辜平民的精气导致大规模伤亡时，他是选择牺牲红绫保全人性底线，还是牺牲无辜者获取力量达成目的。\"},\"world_position\":{\"origin_class\":\"缓冲区贫民\",\"affiliation\":\"无（独立散修）\",\"social_role\":\"战场清理员/黑市情报贩子\",\"stance_on_core_conflict\":\"反对\"},\"essence\":\"身负巨额寿命贷的底层清道夫，以风化尸骸为食，誓要撕开财阀的气血账本。\",\"beliefs\":{\"core_belief\":\"万物皆可吞噬转化，掠夺是底层生存的唯一真理。\",\"belief_source\":\"自幼在缓冲区靠风化尸骸维生，目睹强者随意抽取弱者气血延寿，深刻体会到能量守恒下的残酷剥削。\",\"author_perspective\":\"ambiguous\"},\"extras\":{\"world_anchor\":{\"embodies_rule\":\"能量守恒与转化律\",\"shaped_by_rule\":\"能量守恒与转化律\",\"may_challenge_rule\":\"血脉共鸣限制\"},\"relationships\":[{\"nature\":\"敌对\",\"target\":\"霍天枢\",\"hidden_tension\":\"霍天枢视陈烬为完美的“活体实验样本”，暗中观察其如何在不崩溃的情况下吞噬高浓度怨念\",\"default_attitude\":\"戒备\",\"meaning_to_character\":\"压迫者与剥削源头，必须推翻的高墙\"},{\"nature\":\"利益盟友\",\"target\":\"红绫\",\"hidden_tension\":\"红绫欠铁骨会巨额债务，曾计划将陈烬出卖给联盟换取免债，但因陈烬展现出不可控的潜力而犹豫\",\"default_attitude\":\"依赖\",\"meaning_to_character\":\"唯一的补给线与情报源，也是潜在的背叛风险\"},{\"nature\":\"师徒\",\"target\":\"鬼医\",\"hidden_tension\":\"鬼医在陈烬体内植入了追踪芯片与自毁装置，将其视为对抗联盟的消耗性棋子\",\"default_attitude\":\"敬畏\",\"meaning_to_character\":\"延续生命的唯一希望，也是通往禁忌知识的引路人\"}]},\"voice\":{\"voice_positioning\":\"像是一个在垃圾堆里翻找生路的野兽，声音沙哑低沉，带着长期营养不良的虚弱感，但爆发时极具撕裂性。\",\"syntax_fingerprint\":{\"sentence_preference\":\"短句为主，破碎且急促，模拟呼吸困难的生理状态；情绪激动时句子变得连贯但充满攻击性。\",\"catchphrases\":[\"拿来\",\"不够\",\"那是我的\"],\"pause_habit\":\"在提及“人”、“尊严”或“阿婆”等词汇前会有明显的吞咽式停顿，仿佛喉咙里有异物。\",\"dominant_sentence_type\":\"祈使句与反问句混合，常省略主语，直接指向动作或结果（如“给钱”而非“请给我钱”）。\"},\"cognitive_bias\":\"生存掠夺滤镜：将一切人际关系和物体首先评估为“可吞噬的能量”或“潜在的威胁”，对弱者有本能的共情，对强者有本能的敌意。\",\"forbidden_speech\":[\"绝对不说宏大空洞的道德口号\",\"不使用敬语或谦辞\",\"不主动解释自己的动机\"],\"emotion_patterns\":{\"anger\":\"语速极快，伴随粗重的喘息声，脏字简短有力（“操”、“滚”），不再进行逻辑辩论，直接转化为行动指令。\",\"nervous\":\"频繁清嗓子，手指敲击物体的声音通过麦克风放大，说话结巴，重复确认关键信息（“真的？你确定？”）。\",\"lying\":\"刻意压低声音，减少眼神接触的描述，使用模糊的量词（“大概”、“也许”），试图将话题引向利益交换而非情感层面。\"}},\"created_at\":\"2026-11-27T07:05:53.807457+00:00\",\"updated_at\":\"2026-11-27T07:05:53.807457+00:00\",\"version\":4},{\"name\":\"霍天枢\",\"true_name\":\"霍天枢\",\"role\":\"对手\",\"gender\":\"男\",\"age\":\"外表45岁，实际112岁\",\"aliases\":[\"霍理事\",\"天枢先生\"],\"surface_goal\":\"维持武道联盟的绝对秩序，清除陈烬等破坏气血平衡的异常变量，确保长生教体系的稳定运转。\",\"deep_desire\":\"通过彻底掌控他人的生死与气血，来逃避自身作为“人”的脆弱性与必死宿命，寻求一种超越时间的永恒存在感。\",\"deep_fear\":{\"fear\":\"被还原为毫无意义的“生物电池”，失去作为统治者和观察者的主体性，沦为系统中的一个可替换零件。\",\"source\":\"早年参与建立规则时，亲眼目睹初代盟主因气血枯竭而像废铁一样被拆解回收，意识到在绝对的利益计算面前，连创始人也只是耗材。\"},\"secrets\":{\"content\":\"他的长生并非源自正统修炼，而是依靠定期抽取并融合百名以上平民的精气进行“血肉拼凑”，其身体内部早已溃烂，全靠高科技维生舱和药物维持外表完整。\",\"who_knows\":[\"鬼医\"],\"who_doesnt_know_but_should\":[\"红绫\",\"陈烬\"],\"exposure_consequence\":\"武道联盟的合法性崩塌，底层民众暴动，他将被曾经视为蝼蚁的众生撕碎分食。\"},\"bottom_line\":{\"condition\":\"任何人试图公开质疑或挑战“气血账本”的计算逻辑，尤其是揭露长生背后的剥削本质。\",\"source\":\"这是维系他权力根基和生命延续的唯一理论支柱，一旦逻辑破产，他的存在即失去正当性。\",\"reaction_when_crossed\":\"不再进行任何谈判或威慑，直接启动最高级别的“清洗协议”，不惜代价抹除知情者及其所有社会关系，甚至波及无辜以儆效尤。\"},\"traumas\":{\"wound\":\"百年前，为了获得进入天枢区的资格和初始资源，他亲手切断了与自己贫民窟妹妹的气血连接，导致妹妹因气血逆冲而亡，并将她的遗骨制成了第一把算盘珠子。\",\"trigger\":\"看到具有血缘羁绊的弱者互相牺牲，或听到类似“亲情”、“怜悯”等被视为低效情感的词汇。\",\"stress_response\":\"陷入极度的理性冷漠，通过疯狂计算数据和优化杀戮效率来压抑内心的波动，表情会变得僵硬如面具。\",\"impact_on_behavior\":\"极度排斥不可控的情感因素，将所有人际关系量化为交易筹码，对陈烬这种依靠本能和情感爆发的角色既厌恶又嫉妒。\"},\"contradictions\":{\"conflicting_elements\":\"坚信自己是超越凡俗的秩序神明 vs 内心深处对自己是窃贼和怪物的自我厌恶。\",\"source\":\"他靠掠夺他人生命来维持自己的“高贵”地位，每一次延寿都是对自我道德底线的践踏，这种认知失调迫使他构建了一套冷酷的价值观来自我合理化。\",\"possible_direction\":\"走向彻底的异化，完全抛弃人性成为纯粹的系统意志；或在陈烬的冲击下承认自己的罪孽，选择自我毁灭以终结这个扭曲的系统。\"},\"arc_description\":{\"growth_direction\":\"承认秩序建立在谎言之上，利用手中的权力主动打破基因锁技术垄断，将气血返还给大众，以赎罪者的姿态迎接审判或死亡。\",\"corruption_direction\":\"为了掩盖秘密和维持永生，将整个城市改造为一个巨大的活体培养皿，将自己转化为没有情感、只知吞噬的终极怪物，成为真正的“天道”化身。\",\"key_choice\":\"当陈烬掌握足以摧毁联盟的证据并站在他面前时，是选择启动自毁程序同归于尽以保全最后的尊严，还是吞噬陈烬完成最终的进化成为永恒但非人的存在。\"},\"world_position\":{\"origin_class\":\"天枢区财阀世家\",\"affiliation\":\"武道联盟理事会\",\"social_role\":\"理事长/宗师级强者\",\"stance_on_core_conflict\":\"支持\"},\"essence\":\"武道联盟理事，长生教信徒，视众生为可计算的气血电池，冷酷理性的秩序维护者。\",\"beliefs\":{\"core_belief\":\"秩序高于生命，众生仅是维持系统运转的可计算资源。\",\"belief_source\":\"百年前参与建立武道联盟规则，通过冷酷理性将混乱的江湖纳入可控体系，并从中获得长生与权力。\",\"author_perspective\":\"wrong\"},\"extras\":{\"world_anchor\":{\"embodies_rule\":\"杀气显化原则\",\"shaped_by_rule\":\"血脉共鸣限制\",\"may_challenge_rule\":\"能量守恒与转化律\"},\"relationships\":[{\"nature\":\"猎杀目标\",\"target\":\"陈烬\",\"hidden_tension\":\"霍天枢年轻时曾做过同样的事，他在陈烬身上看到了自己抛弃的人性，既想毁灭又想占有\",\"default_attitude\":\"轻视\",\"meaning_to_character\":\"扰乱市场秩序的变量，需被回收研究的异常数据\"},{\"nature\":\"控制与被控制\",\"target\":\"红绫\",\"hidden_tension\":\"红绫掌握着霍天枢私自抽取平民精气延寿的证据，这是她唯一的保命符\",\"default_attitude\":\"冷漠\",\"meaning_to_character\":\"安插在底层的耳目，随时可弃的工具\"},{\"nature\":\"昔日同门\",\"target\":\"鬼医\",\"hidden_tension\":\"两人曾共同研发“基因锁”技术，鬼医因伦理分歧出走，霍天枢始终未能解开鬼医留下的最后一道加密算法\",\"default_attitude\":\"厌恶\",\"meaning_to_character\":\"叛逃的实验助手，知晓联盟核心机密的最大隐患\"}]},\"voice\":{\"voice_positioning\":\"像是精密运行的服务器风扇声，平稳、冰冷、毫无起伏，带着一种居高临下的疏离感和金属质感的回响。\",\"syntax_fingerprint\":{\"sentence_preference\":\"长难句，结构严谨，逻辑闭环，极少使用感叹号。\",\"catchphrases\":[\"计算显示\",\"这是必要的损耗\",\"秩序即正义\"],\"pause_habit\":\"在说出残酷结论前有固定的0.5秒停顿，用于展示其“理性思考”的过程，实则是为了压抑情感波动。\",\"dominant_sentence_type\":\"判断句与被动句，强调客观规律而非个人意志（如“你被判定为异常”而非“我要杀你”）。\"},\"cognitive_bias\":\"数据量化滤镜：将生命视为可计算的数值，将情感视为系统噪音，认为所有冲突都可以通过资源重新分配来解决。\",\"forbidden_speech\":[\"绝不使用情绪化形容词（如“可怜”、“愤怒”）\",\"不承认错误或表达歉意\",\"不进行无利益目的的闲聊\"],\"emotion_patterns\":{\"anger\":\"声音反而变得更加轻柔缓慢，用词更加学术化和抽象化，通过列举对方的“低效”来实施精神压迫。\",\"nervous\":\"语速出现微小的加速，开始频繁引用数据和规则条文，试图用逻辑壁垒掩盖内心的恐慌。\",\"lying\":\"使用极其精确但无关紧要的细节来构建真实感，回避核心因果链条，语气保持绝对的平稳以迷惑听众。\"}},\"created_at\":\"2026-11-27T07:05:53.807457+00:00\",\"updated_at\":\"2026-11-27T07:05:53.807457+00:00\",\"version\":4},{\"name\":\"红绫\",\"true_name\":\"苏红\",\"role\":\"重要配角\",\"gender\":\"女\",\"age\":\"29岁\",\"aliases\":[\"红姐\",\"蛇女\"],\"surface_goal\":\"偿还铁骨会的高额债务，积累足够资本逃离九龙城寨，获得彻底的人身自由。\",\"deep_desire\":\"被无条件地接纳与保护，渴望在充满算计的世界中找到一个不需要伪装、不需要计算得失就能安心停靠的港湾。\",\"deep_fear\":{\"fear\":\"沦为毫无价值的弃子，在失去利用价值后被各方势力像垃圾一样丢弃或抹杀。\",\"source\":\"荒弃带孤儿时期的生存经历，以及多次被信任之人出卖以换取利益的创伤记忆，让她深信自己在他人眼中仅是可交易的筹码。\"},\"secrets\":{\"content\":\"她私自挪用黑市高价灵药替换了供给陈烬的劣质补剂，导致自身气血严重亏空，身体机能加速衰退；同时掌握着霍天枢非法抽取平民精气延寿的核心证据。\",\"who_knows\":[\"鬼医\"],\"who_doesnt_know_but_should\":[\"陈烬\",\"霍天枢\"],\"exposure_consequence\":\"若被霍天枢知晓，将被立即清除以灭口；若被陈烬知晓，可能因愧疚而破坏两人间脆弱的利益平衡，或引发陈烬不顾一切的复仇从而打乱她的逃生计划；若被铁骨会发现，将面临残酷的肉体惩罚。\"},\"bottom_line\":{\"condition\":\"任何试图剥夺她最后一点自主选择权，或将她视为纯粹消耗品而非独立个体的行为。\",\"source\":\"长期处于被控制、被交易的环境中，对自我主体性的极端捍卫，这是她作为“人”而非“货物”的最后尊严。\",\"reaction_when_crossed\":\"表面顺从麻痹对方，暗中启动同归于尽的陷阱或利用手中掌握的致命黑料进行不对称打击，即便牺牲自己也要让对方付出惨重代价。\"},\"traumas\":{\"wound\":\"少年时期曾被视作亲人的黑市中间人捆绑出售给武道联盟做实验体，她在极度恐惧中反杀中间人并逃亡，从此坚信情感是致命的弱点。\",\"trigger\":\"目睹无辜者被强者随意牺牲，或感受到来自亲近之人的潜在背叛意图时。\",\"stress_response\":\"过度理性化，迅速切断情感连接，将眼前的人事物重新量化为利益数值，表现出异常的冷漠与精于算计。\",\"impact_on_behavior\":\"在人际交往中始终保持距离感，习惯性隐藏真实意图，即使在帮助陈烬时也披着利益交换的外衣，不敢坦然接受善意。\"},\"contradictions\":{\"conflicting_elements\":\"极度利己的生存本能与对陈烬日益滋长的、非理性的保护欲之间的冲突。\",\"source\":\"陈烬展现出的不可控潜力与纯粹性触动了她内心深处对被救赎的渴望，但这与她信奉的“唯有利益可靠”的生存法则背道而驰。\",\"possible_direction\":\"走向自我牺牲式的救赎，或者在关键时刻为了自保而再次选择背叛，陷入更深的自我厌恶。\"},\"arc_description\":{\"growth_direction\":\"打破“交易即安全”的心理枷锁，学会信任与合作，从精致的利己主义者转变为拥有坚定立场的反抗者，用智慧而非单纯的算计去争取自由。\",\"corruption_direction\":\"彻底异化为冷酷无情的操盘手，为了生存不惜出卖陈烬和所有盟友，成为比霍天枢更善于隐藏恶意的投机者，最终在孤独中消亡。\",\"key_choice\":\"当霍天枢提供免除所有债务并赋予高层身份的条件，要求她交出陈烬的行踪与弱点时，她是选择交出筹码换取安稳的奴役，还是选择与陈烬共同面对未知的死亡风险。\"},\"world_position\":{\"origin_class\":\"荒弃带孤儿\",\"affiliation\":\"铁骨会（表面）/ 武道联盟（暗线）\",\"social_role\":\"黑市中介/情报贩子\",\"stance_on_core_conflict\":\"投机\"},\"essence\":\"九龙城寨黑市掮客，双面间谍，在夹缝中求生的艳丽毒花。\",\"beliefs\":{\"core_belief\":\"信任是奢侈品，唯有利益交换和手中筹码才能保障生存。\",\"belief_source\":\"作为荒弃带孤儿在黑市摸爬滚打，多次被亲近之人出卖，深知在夹缝中求生不能依赖任何人的善意。\",\"author_perspective\":\"ambiguous\"},\"extras\":{\"world_anchor\":{\"embodies_rule\":\"能量守恒与转化律\",\"shaped_by_rule\":\"杀气显化原则\",\"may_challenge_rule\":\"血脉共鸣限制\"},\"relationships\":[{\"nature\":\"暧昧/利用\",\"target\":\"陈烬\",\"hidden_tension\":\"她偷偷用高价灵药替换了给陈烬的劣质补剂，导致自己气血亏空严重，却谎称是市场行情波动\",\"default_attitude\":\"亲近\",\"meaning_to_character\":\"最具价值的投资对象，也是令她心动却不敢靠近的危险源\"},{\"nature\":\"从属\",\"target\":\"霍天枢\",\"hidden_tension\":\"她正在搜集霍天枢的犯罪证据，试图在一次交易中同时坑骗双方并远走高飞\",\"default_attitude\":\"敬畏\",\"meaning_to_character\":\"掌控生死的阎王，恐惧与憎恨的集合体\"},{\"nature\":\"医患\",\"target\":\"鬼医\",\"hidden_tension\":\"鬼医治好了她的隐疾，但要求她定期提供陈烬的身体数据，她在忠诚与友情间挣扎\",\"default_attitude\":\"戒备\",\"meaning_to_character\":\"修复身体损伤的唯一依靠，也是保守秘密的同谋\"}]},\"voice\":{\"voice_positioning\":\"像是裹着丝绸的匕首，语调慵懒艳丽，带着黑市特有的圆滑与试探，笑声中藏着算计。\",\"syntax_fingerprint\":{\"sentence_preference\":\"中长句，节奏多变，善于使用反问和设问引导对话走向。\",\"catchphrases\":[\"亲爱的\",\"这笔买卖\",\"你看呢？\"],\"pause_habit\":\"在关键信息前故意拖长尾音，观察对方反应后再决定是否抛出真话。\",\"dominant_sentence_type\":\"条件复句，习惯先提出代价再给出方案（“如果你能...我就...”）。\"},\"cognitive_bias\":\"交易博弈滤镜：将所有人视为潜在的交易对象或背叛者，时刻评估对方的利用价值和危险系数，不相信无偿的善意。\",\"forbidden_speech\":[\"不直接承诺无法兑现的事\",\"不暴露自己的真实底牌\",\"不使用绝对化的肯定句（除非是为了欺骗）\"],\"emotion_patterns\":{\"anger\":\"笑容消失，语调瞬间降至冰点，使用简短的命令式语句，不再称呼对方昵称，直接点名道姓。\",\"nervous\":\"语速加快，笑声变得尖锐且不自然，频繁使用填充词（“那个”、“其实”），试图用废话填补沉默。\",\"lying\":\"语气格外温柔亲切，主动提供大量看似透明的次要信息，避重就轻，用情感包装来掩盖事实缺口。\"}},\"created_at\":\"2026-11-27T07:05:53.807457+00:00\",\"updated_at\":\"2026-11-27T07:05:53.807457+00:00\",\"version\":4},{\"name\":\"鬼医\",\"true_name\":\"李墨白\",\"role\":\"导师\",\"gender\":\"男\",\"age\":\"外表60岁，实际未知\",\"aliases\":[\"疯子医生\",\"0号实验体\"],\"surface_goal\":\"完成“完美进化”理论，创造出超越气血守恒限制的永生形态，并向霍天枢复仇。\",\"deep_desire\":\"渴望被理解与认可，希望有人能证明他抛弃人性并非错误，而是通往更高真理的必要代价。\",\"deep_fear\":{\"fear\":\"沦为毫无意义的怪物，既失去了人类的身份，又未能触及神的领域，最终在疯狂中自我崩解。\",\"source\":\"目睹早期实验体因无法承受机械与肉体排斥而痛苦惨死，以及自身改造过程中逐渐丧失感官知觉的恐惧。\"},\"secrets\":{\"content\":\"他并未完全告知陈烬修炼功法的副作用，因为那正是他想要观察的“进化契机”；同时，他私自保留了霍天枢基因锁的另一半密钥，但从未打算用它来解锁，而是将其作为引发霍天枢体内能量暴走的炸弹。\",\"who_knows\":[],\"who_doesnt_know_but_should\":[\"陈烬\",\"霍天枢\"],\"exposure_consequence\":\"陈烬将视其为纯粹的利用工具并可能反噬，霍天枢将不惜一切代价摧毁他以夺回或销毁密钥。\"},\"bottom_line\":{\"condition\":\"任何人试图以“伦理”或“道德”为由阻止他的核心实验，或通过情感羁绊干扰他对“进化数据”的客观记录。\",\"source\":\"坚信科学不应受凡俗道德束缚，认为情感是阻碍进化的噪音。\",\"reaction_when_crossed\":\"冷酷地清除障碍，无论对方是盟友还是亲人，甚至可能将其转化为新的实验素材以验证理论。\"},\"traumas\":{\"wound\":\"百年前与霍天枢共同研发“基因锁”技术时，因坚持保留人类意识上传的可能性而被霍天枢背叛，不仅被剥夺了首席科学家身份，还被强制进行初步机械化改造，导致妻女在随后的清洗中丧生。\",\"trigger\":\"看到类似当年妻女遗物的物品，或听到霍天枢提及“秩序”与“牺牲”等词汇。\",\"stress_response\":\"陷入短暂的解离状态，机械义肢出现不受控制的震颤，随后转为极端的冷静与计算模式。\",\"impact_on_behavior\":\"对“秩序”有着病态的憎恶，倾向于制造混乱以测试系统的韧性；对亲密关系极度回避，将所有人际关系量化为数据交换。\"},\"contradictions\":{\"conflicting_elements\":\"理性上追求摒弃人性以达到神性进化，感性深处却渴望通过“作品”（如陈烬）来证明自己仍保有创造生命的“人性”光辉。\",\"source\":\"作为科学家的理智与作为受害者的情感创伤之间的撕裂。\",\"possible_direction\":\"走向和解需承认情感也是进化的一部分，走向崩溃则彻底异化为只知计算的冷血机器。\"},\"arc_description\":{\"growth_direction\":\"意识到真正的进化不仅是肉体的超越，更是意识的包容。他可能选择牺牲自己的机械躯体，将毕生研究转化为帮助陈烬打破血脉限制的关键，从而在精神上完成对人性的回归与救赎。\",\"corruption_direction\":\"彻底沉溺于力量与控制，将陈烬完全物化为实验容器，甚至主动与霍天枢达成交易，以出卖陈烬为代价换取更高级的机械化改造，成为比霍天枢更冷酷的秩序维护者。\",\"key_choice\":\"当陈烬面临生死危机且数据收集未完成时，是选择继续观察记录以获取完美数据，还是中断实验出手相救从而暴露自身弱点并失去部分研究成果。\"},\"world_position\":{\"origin_class\":\"天枢区前首席科学家\",\"affiliation\":\"猎命者同盟（精神领袖）\",\"social_role\":\"地下医师/禁忌研究者\",\"stance_on_core_conflict\":\"反对\"},\"essence\":\"被联盟通缉的禁忌医师，半机械半肉体的怪物，追求超越气血守恒的终极进化。\",\"beliefs\":{\"core_belief\":\"肉体是进化的枷锁，唯有打破伦理界限才能触及生命的终极形态。\",\"belief_source\":\"曾与霍天枢共同研发技术却因伦理分歧被背叛，随后将自己改造成半机械怪物，坚信科学不应受道德束缚。\",\"author_perspective\":\"wrong\"},\"extras\":{\"world_anchor\":{\"embodies_rule\":\"血脉共鸣限制\",\"shaped_by_rule\":\"能量守恒与转化律\",\"may_challenge_rule\":\"能量守恒与转化律\"},\"relationships\":[{\"nature\":\"师徒/实验者\",\"target\":\"陈烬\",\"hidden_tension\":\"他并未完全告知陈烬修炼功法的副作用，因为那正是他想要观察的“进化契机”\",\"default_attitude\":\"严厉\",\"meaning_to_character\":\"验证理论的最佳容器，也是继承衣钵的希望\"},{\"nature\":\"死敌\",\"target\":\"霍天枢\",\"hidden_tension\":\"霍天枢体内的基因锁密钥有一半在鬼医手中，这是双方保持微妙平衡的原因\",\"default_attitude\":\"仇恨\",\"meaning_to_character\":\"窃取成果并扭曲科学的伪君子，必须摧毁的偶像\"},{\"nature\":\"交易伙伴\",\"target\":\"红绫\",\"hidden_tension\":\"他知道红绫的双面身份，但不在乎，只要她能带来有趣的数据和新鲜的肢体\",\"default_attitude\":\"漠然\",\"meaning_to_character\":\"稳定的素材提供者与眼线\"}]},\"voice\":{\"voice_positioning\":\"像是生锈齿轮摩擦的声音，夹杂着电子合成音的失真感，语调疯狂而亢奋，带着一种病态的求知欲。\",\"syntax_fingerprint\":{\"sentence_preference\":\"跳跃性极强，长短句无序切换，常在句子中间插入专业术语或自言自语。\",\"catchphrases\":[\"有趣的数据\",\"进化\",\"切开看看\"],\"pause_habit\":\"在观察实验对象时有长时间的沉默，随后突然爆发出一连串快速的技术性描述。\",\"dominant_sentence_type\":\"陈述句与疑问句混杂，常以科学假设的口吻提出问题（“如果切除这部分，你会死吗？”）。\"},\"cognitive_bias\":\"实验观察滤镜：将世界视为巨大的实验室，将他人视为样本或变量，缺乏基本的伦理共情，只关注现象背后的机制。\",\"forbidden_speech\":[\"不使用道德评判词汇\",\"不安慰受害者\",\"不解释行为的情感动机\"],\"emotion_patterns\":{\"anger\":\"发出刺耳的电子噪音，语言变得支离破碎，充满对“愚蠢”和“低效”的咒骂，伴随机械肢体的撞击声。\",\"nervous\":\"反复念叨实验步骤或数据参数，语速极快且含糊不清，试图通过沉浸于技术细节来逃避现实压力。\",\"lying\":\"使用半真半假的技术术语混淆视听，声称某些行为是“为了你好”或“进化的必要阶段”，语气显得理所当然。\"}},\"created_at\":\"2026-11-27T07:05:53.807457+00:00\",\"updated_at\":\"2026-11-27T07:05:53.807457+00:00\",\"version\":4}],\"storyPlan\":{\"book_id\":\"3cee6a4b-376b-4b0d-92c1-2e4bc49bef8b\",\"resource_type\":\"book\",\"resource_key\":\"story_plan\",\"version\":1,\"content\":{\"engine\":{\"essence\":\"气血赤字驱动：每解决一个危机必产生新的债务或暴露更多秘密，迫使主角不断深入禁区。\",\"dual_story\":{\"background\":\"武道联盟统治合法性的崩塌过程。霍天枢如何维持谎言、鬼医的复仇计划、红绫的证据搜集，以及陈烬的能力如何从微观上瓦解‘气血即货币’的宏观逻辑。这是贯穿全书的暗线。\",\"foreground\":\"陈烬作为清道夫/猎命者的生存战。包括躲避肃清者追踪、在黑市争夺资源、与铁骨会周旋、解决眼前的生死仇杀。这是读者每章看到的直接冲突。\"},\"mystery_box\":\"‘良性转化’的终极真相与霍天枢长生的具体操作机制。读者一直追问：陈烬为何能无副作用地吸收怨念？霍天枢究竟是如何绕过基因锁进行百人拼接的？这两个答案交汇之处，隐藏着打破‘能量守恒’诅咒、重构武道规则的关键钥匙。\",\"conflict_engine\":\"升级力学：‘信息-资源’螺旋。陈烬每获得一点关于霍天枢或基因锁的秘密（信息），就需要更高阶的资源（如禁区异兽肉、禁忌药物）来消化或验证，而获取这些资源必然触动更高层级的利益集团（从铁骨会到联盟理事会）。同时，他的‘良性转化’能力越使用，越引起霍天枢的警惕与猎杀力度升级，迫使他从隐蔽生存转向正面对抗。麻烦不会消失，只会从‘生存危机’升级为‘存在危机’。\",\"conflict_layers\":{\"external\":\"武道联盟的系统性抹杀与资源封锁。联盟通过监控杀气、控制灵药供应链、发布通缉令，构建了一张无处可逃的天网。任何违规使用内力或触及禁忌的行为都会触发自动防御机制。\",\"internal\":\"人性与兽性的拉锯。陈烬必须在每次使用力量时抵抗怨念侵蚀，保持理智。他对弱者的保护欲常导致战术失误，而过度理性又可能让他滑向霍天枢式的冷漠。\",\"relational\":\"信任与背叛的量子态。红绫既是盟友又是潜在叛徒，鬼医既是导师又是观察者。陈烬无法完全信赖任何人，必须在利用与被利用之间走钢丝，关系随时可能因利益筹码变化而反转。\"},\"progression_loop\":\"循环法则：‘负债-狩猎-曝光-逃亡’。1. 触发：寿命贷到期或身体出现衰竭征兆，急需高能资源。2. 行动：进入更危险区域（如旧改区深处、禁区边缘）猎杀或交易。3. 代价：获得资源的同时，暴露行踪、留下杀气痕迹或欠下新的人情/债务。4. 升级：引来更强追兵或发现更大阴谋碎片，迫使下一轮循环进入更高层级势力范围。循环加速条件：红绫的情报失误或鬼医的实验干预。\",\"protagonist_trap\":\"结构性困局：陈烬身负‘寿命贷’，时间本身就是催命符，不行动即死，行动则加速消耗或暴露。内在裂缝：他渴望被确认为‘人’，但生存手段（吞噬、风化尸体）却不断将他推向‘怪物’的边缘，这种认知失调导致他在关键时刻容易陷入非理性狂暴。可变化空间：他从单纯恐惧异化，到利用‘记忆碎片’能力理解敌人，最终学会在不丧失人性的前提下驾驭力量，从‘被动承受者’转变为‘主动定义者’。\"},\"issues\":[],\"payoff\":{\"essence\":\"以命搏命，在理智崩溃边缘引爆禁忌力量；爽感源于对冷酷规则的精准践踏与人性底线的死守。\",\"growth_path\":\"从‘只求生存的利己主义者’（相信掠夺是唯一真理）→ ‘困惑的探索者’（发现良性转化的可能性，质疑现有规则）→ ‘坚定的反抗者’（意识到个人力量不足以改变系统，开始寻求同盟与真相）→ ‘新秩序的奠基人’（接受力量的代价，但拒绝将其转嫁给弱者，重新定义强弱标准）。\",\"ending_flavor\":\"沉重但清醒的胜利。陈烬并未成为新的神，而是摧毁了‘神’的宝座。读者合上书时，感受到的不是大团圆的喜悦，而是一种‘虽然世界依然残酷，但人终于夺回了定义自己的权利’的肃穆与释然。\",\"payoff_grammar\":[\"规则反杀型：叙事条件：主角处于绝对劣势，常规武力无法取胜。触发：主角利用‘能量守恒’或‘杀气显化’的规则漏洞（如故意制造假杀气诱敌、利用环境热能抵消内力消耗）。爽感来源：智力碾压武力，对傲慢强者的戏弄与反制。\",\"禁忌爆发型：叙事条件：主角被逼入绝境，理智濒临崩溃。触发：主动或部分释放‘记忆碎片’中的怨念力量，短暂获得超越境界的实力，但伴随巨大副作用。爽感来源：压抑后的极致释放，视觉与感官上的暴力美学，以及事后幸存的庆幸。\",\"身份揭露型：叙事条件：长期伪装或隐藏秘密的角色在关键场合被揭穿。触发：红绫抛出证据或陈烬展示真实能力。爽感来源：权力关系的瞬间反转，伪善者面具破碎的快感，以及真相大白时的震撼。\"],\"emotional_rhythm\":\"情绪波呈‘锯齿状’上升。周期：高压潜伏（焦虑、压抑）→ 短暂喘息（温情、希望）→ 突发危机（惊恐、愤怒）→ 爆发反击（宣泄、爽快）→ 代价回落（疲惫、虚无）。振幅随剧情推进逐渐增大，前期的‘喘息’越来越短，后期的‘爆发’越来越惨烈。转折触发点通常为信任背叛或重要配角伤亡。\",\"tension_archetypes\":[\"静默猎杀型：在信号中断、温度骤降的‘杀气显化’环境中，主角与强者进行无声的感知博弈。成立条件：封闭空间或复杂地形，双方均不敢轻易暴露位置，张力源于对‘先被发现即死’的恐惧。\",\"道德困境型：主角面临‘牺牲无辜者获取力量’或‘坚守底线导致失败’的选择。成立条件：资源极度匮乏且时间紧迫，对手利用主角的道德弱点设局。张力源于读者对主角人性底线的担忧与期待。\"]},\"surface\":{\"essence\":\"在气血即货币的赛博江湖，一个靠吞噬死者记忆存活的清道夫，向将人视为电池的秩序发起清算。\",\"core_conflict\":\"个体尊严与系统性剥削的不可调和对立。霍天枢代表的武道联盟建立在‘众生即资源’的逻辑上，其统治合法性依赖于将人命量化为可计算的‘血点’；陈烬的存在本身（良性转化、保留人性）证明了该逻辑的虚假与可被颠覆性。妥协意味着陈烬接受被圈养、被解剖的命运，或霍天枢承认其统治根基是谎言并自我毁灭。这是生存哲学层面的死结：要么人重新成为人，要么人彻底沦为电池。\",\"reader_promise\":\"读者将持续体验‘在绝境中通过智慧与代价换取爆发’的爽感。每一次战斗不仅是武力的碰撞，更是对‘能量守恒’规则的极限利用与反杀。读者将目睹主角如何在资源匮乏、强敌环伺的环境下，通过信息不对称、心理博弈以及对规则漏洞的精准打击，层层剥开庞大阴谋，最终实现从‘拾荒者’到‘规则重塑者’的身份跃迁。\",\"target_readers\":\"喜爱黑暗奇幻、赛博朋克风格，追求高智商博弈、残酷世界观下人性光辉以及‘以弱胜强’逻辑严密性的成年读者。\",\"tone_reference\":\"冷硬、潮湿且带有铁锈味。叙述聚焦于生理性的痛苦与精算式的冷酷，如‘陈烬吞下那支劣质营养液，胃壁像被砂纸打磨般灼烧，但他计算过，这点疼痛比被风化成干尸便宜得多’。对话简短、充满试探与潜台词，强者路过时空气结霜的压抑感贯穿始终。不渲染史诗般的悲壮，只呈现生存本能下的挣扎与算计。\",\"commercial_tags\":[\"赛博武侠\",\"黑暗生存\",\"智斗复仇\"],\"expanded_premise\":\"陈烬身处一个‘气劲即寿命’的残酷世界，底层武者必须通过掠夺高能生物质或透支细胞活性来维持生存与修为。作为缓冲区的一名战场清理员，陈烬背负着巨额‘寿命贷’，每日在风化黑尸中搜寻残存气血以苟活。他意外觉醒了通过共情化解怨念、良性转化能量的禁忌能力，这使他成为武道联盟理事长霍天枢眼中的‘完美实验样本’与系统漏洞。霍天枢依靠抽取平民精气维持长生，视陈烬为必须回收的异常变量；而地下医师鬼医则将陈烬视为验证‘超越守恒律’理论的容器。陈烬被困在债务、追杀与自身人性异化的夹缝中，他必须在彻底沦为只知进食的怪物之前，利用红绫的情报网与鬼医的禁忌知识，揭开霍天枢长生的血腥真相，打破‘零和博弈’的血色账本。\"},\"constraints\":[\"严禁描写主角在无代价情况下使用高阶武技。每次爆发必须伴随明确的生理损伤、寿命扣除或精神污染描述，体现‘能量守恒’的铁律。\",\"战斗场景必须结合‘杀气显化’的环境反馈（降温、信号干扰、玻璃结霜），不得写成纯物理打斗。环境应成为战斗的一部分，影响战术选择。\",\"角色对话不得出现长篇大论的说教或背景介绍。信息传递必须通过行动、交易、威胁或隐晦的暗示完成，保持‘黑市情报贩子’式的简洁与多义性。\",\"禁止出现‘机械义肢完美替代肉体’的情节。机械只能作为辅助或陷阱，核心力量必须源自生物性内力，违者需符合‘爆炸’设定。\",\"红绫与鬼医的背叛或帮助必须有明确的利益或数据动机支撑，不得出现无缘无故的善意或恶意。所有关系变动需符合‘投机’或‘实验’的人设逻辑。\"]},\"updated_at\":\"2026-11-28T02:30:32.937853+00:00\"},\"volumeOutline\":{\"type\":\"volume\",\"volume_number\":1,\"chapter_start\":1,\"chapter_end\":10,\"content\":{\"acts\":{\"resolve\":{\"content\":\"卷入涉及霍天枢长生秘密的零星证据交易，被联盟肃清者锁定。在绝境中被迫使用部分禁忌力量突围，虽暂时存活但彻底暴露于监控雷达之下，卷末陷入更深的逃亡危机。\",\"chapters\":\"第8-10章\"},\"confront\":{\"content\":\"为偿还即将到期的巨额债务，深入九龙城寨黑市争夺高危异兽资源，遭遇铁骨会围猎，首次在不暴露核心秘密的前提下利用环境规则反杀通脉境武者。\",\"chapters\":\"第4-7章\"},\"establish\":{\"content\":\"展示陈烬作为清道夫的悲惨日常与寿命贷压力，觉醒通过共情转化怨念的能力，引入红绫与鬼医的利益链条。\",\"chapters\":\"第1-3章\"}},\"nodes\":[{\"id\":\"A\",\"consequence\":\"确立读者对主角生存困境的共情，明确不行动即死亡的初始动力。\",\"description\":\"建立主角与世界的生理性联系：展示风化过程、气血代价及寿命贷的催命紧迫感。\"},{\"id\":\"B\",\"consequence\":\"赋予主角破局手段，但埋下精神失控的隐患，增加后续战斗的不确定性。\",\"description\":\"揭示禁忌能力的双刃剑属性：通过一次小规模转化成功获得能量，同时伴随剧烈的幻觉反噬。\"},{\"id\":\"C\",\"consequence\":\"验证智斗复仇的爽感模式，同时引起地下势力初步注意，提升危险等级。\",\"description\":\"完成第一次基于规则的黑市博弈：利用信息差或环境陷阱击败强敌，而非纯武力碾压。\"},{\"id\":\"D\",\"consequence\":\"将个人生存危机升级为政治惊悚，触发联盟高层的直接干预，改变追杀性质。\",\"description\":\"触碰主线阴谋边缘：意外获取或目睹与霍天枢长生机制相关的微量证据碎片。\"},{\"id\":\"E\",\"consequence\":\"打破安全屋幻象，迫使主角离开舒适区，为下一卷进入更广阔战场铺路。\",\"description\":\"付出惨痛代价后的突围：在肃清者围剿下幸存，但身体遭受不可逆损伤或欠下更大人情债。\"}],\"title\":\"锈蚀账本\",\"ending\":{\"suspense\":\"联盟已锁定其生物特征，下一次追杀将是宗师级介入。鬼医的真正意图仍未完全揭晓。\",\"character_state\":\"陈烬身体多处经脉受损，寿命贷债务未减反增，但因掌握微量关键证据而获得谈判筹码（虽不敢用）。精神状态处于轻度解离边缘。\",\"emotional_aftertaste\":\"压抑中的窒息感，夹杂着一丝掌握真相后的战栗与清醒。读者感到主角如履薄冰，随时可能坠入深渊。\"},\"conflicts\":{\"external\":\"武道联盟的自动化杀气监控网络与铁骨会的暴力收债，具体表现为肃清者的定点清除与黑市打手的物理围剿。\",\"internal\":\"对人性沦丧的恐惧与生存本能的拉锯。陈烬在吞噬死者记忆时，必须抵抗情感碎片带来的精神污染，保持理智不崩解。\",\"underlying\":\"霍天枢对“良性转化”异常变量的系统性关注。陈烬的特殊性已被标记为需要回收研究的“高价值样本”，而非单纯的违规者。\"},\"characters\":[{\"name\":\"陈烬\",\"identity\":\"缓冲区清道夫/负债散修\",\"narrative_function\":\"视角载体，展示世界观残酷性，执行从被动接受到主动反抗的身份转折。\"},{\"name\":\"红绫\",\"identity\":\"黑市中介/双面间谍\",\"narrative_function\":\"利益纽带与信息提供者，制造信任危机，推动主角进入黑市深层网络。\"},{\"name\":\"鬼医\",\"identity\":\"地下医师/前首席科学家\",\"narrative_function\":\"禁忌知识授予者与观察者，提供技术支援的同时施加实验控制，揭示背景秘密。\"},{\"name\":\"霍天枢\",\"identity\":\"武道联盟理事长\",\"narrative_function\":\"幕后压迫源与终极对手，通过代理人展现绝对权力，确立本卷的绝望基调。\"},{\"name\":\"肃清者队长\",\"identity\":\"联盟执法精英/通脉巅峰\",\"narrative_function\":\"具象化的外部威胁，执行抹杀任务，测试主角极限并造成物理创伤。\"}],\"style_tone\":\"冷硬、潮湿、带有铁锈味。节奏紧凑，强调生理痛苦与精算式冷酷。对话简短多义，避免说教。战斗描写侧重环境反馈（降温、信号干扰）与代价呈现。\",\"positioning\":\"确立底层生存逻辑，引入主角禁忌能力，将个人债务危机转化为与系统规则的第一次正面碰撞。\",\"chapter_range\":{\"end\":10,\"start\":1},\"volume_number\":1},\"created_at\":\"2026-11-28T02:32:36.853967+00:00\",\"updated_at\":\"2026-11-28T02:32:36.853967+00:00\",\"resource_key\":\"volume:1\",\"version\":1},\"nearTermOutline\":{\"type\":\"near_term\",\"volume_number\":1,\"chapter_start\":1,\"chapter_end\":10,\"content\":{\"arc_name\":\"锈蚀账本\",\"chapters\":[{\"title\":\"风化余烬\",\"number\":1,\"rhythm\":\"铺垫\",\"summary\":\"陈烬在缓冲区清理高辐射尸骸，因寿命贷到期被迫透支体能，意外觉醒吞噬怨念的能力，获得短暂喘息却引发剧烈头痛幻觉\",\"time_advance\":\"+1日\"},{\"title\":\"黑市契约\",\"number\":2,\"rhythm\":\"蓄力\",\"summary\":\"陈烬向红绫出售刚获取的高纯度气血石，被鬼医强行植入监测芯片并告知能力真相，被迫接受成为实验体的命运以换取延寿药物\",\"time_advance\":\"+1日\"},{\"title\":\"第一次进食\",\"number\":3,\"rhythm\":\"释放\",\"summary\":\"为验证能力可控性，陈烬主动接触一名刚死的低阶武者尸体，成功转化能量但未完全压制怨念，导致左手出现不可逆的黑斑侵蚀\",\"time_advance\":\"+2日\"},{\"title\":\"猎杀邀请\",\"number\":4,\"rhythm\":\"蓄力\",\"summary\":\"红绫提供九龙城寨深处高危异兽的情报，陈烬为偿还即将到期的巨额利息被迫接单，进入铁骨会控制区发现这是针对散修的围猎局\",\"time_advance\":\"+1日\"},{\"title\":\"铁骨围城\",\"number\":5,\"rhythm\":\"释放\",\"summary\":\"陈烬遭遇铁骨会三名通脉境打手围剿，利用狭窄地形与信号干扰器制造混乱，重伤逃脱但丢失了大部分战利品\",\"time_advance\":\"+1日\"},{\"title\":\"规则漏洞\",\"number\":6,\"rhythm\":\"铺垫\",\"summary\":\"陈烬分析战斗数据，发现铁骨会成员依赖外部气血补给的特性，设计陷阱诱导对方在低温环境中过度使用内力导致经脉冻结\",\"time_advance\":\"+1日\"},{\"title\":\"寒夜反杀\",\"number\":7,\"rhythm\":\"释放\",\"summary\":\"陈烬重返战场，利用环境温差与伪装杀气诱敌深入，在不暴露核心能力的前提下击杀两名追兵，夺取关键补给但引来更高级别监控\",\"time_advance\":\"+2日\"},{\"title\":\"长生碎片\",\"number\":8,\"rhythm\":\"蓄力\",\"summary\":\"在黑市交易战利品时，陈烬意外从一名死者遗物中获得霍天枢私自抽取平民精气的加密数据盘，瞬间被联盟肃清者锁定位置\",\"time_advance\":\"+1日\"},{\"title\":\"肃清降临\",\"number\":9,\"rhythm\":\"释放\",\"summary\":\"肃清者队长带队突袭安全屋，陈烬在绝境中被迫部分释放禁忌力量对抗宗师级威压，虽击退敌人但右臂经脉彻底断裂，精神濒临崩溃\",\"time_advance\":\"+1日\"},{\"title\":\"逃亡起点\",\"number\":10,\"rhythm\":\"后效\",\"summary\":\"鬼医通过远程手段协助陈烬暂时屏蔽生物特征，陈烬带着证据碎片逃离缓冲区，从此失去合法身份，正式踏入全境通缉的逃亡之路\",\"time_advance\":\"+3日\"}],\"chapter_range\":{\"end\":10,\"start\":1},\"volume_number\":1,\"character_arcs\":[{\"to\":\"掌握关键证据但身心俱损的通缉犯\",\"from\":\"被动承受债务压榨的清道夫\",\"name\":\"陈烬\",\"change\":\"从单纯恐惧异化转变为有意识地利用禁忌力量，确立了对抗系统的决心\"},{\"to\":\"暗中保护陈烬的双面间谍\",\"from\":\"唯利是图的黑市中介\",\"name\":\"红绫\",\"change\":\"因陈烬的潜力与自身道德底线产生动摇，开始从纯粹投机转向风险投资\"}],\"decision_points\":[{\"choice\":\"拒绝鬼医的监控或接受实验体身份\",\"impact\":\"接受监控换取生存资源，但失去行动自由与隐私，埋下被控制的隐患\",\"chapter\":2,\"character\":\"陈烬\"},{\"choice\":\"纯武力硬拼或利用环境规则智取\",\"impact\":\"选择智取保住性命并验证战术，但暴露了具备高阶战斗智慧的事实，引起联盟注意\",\"chapter\":7,\"character\":\"陈烬\"},{\"choice\":\"坚守人性底线或释放怨念力量\",\"impact\":\"被迫释放力量造成身体不可逆损伤，但成功突围，标志着他从被动防御转向主动承担代价\",\"chapter\":9,\"character\":\"陈烬\"}]},\"created_at\":\"2026-11-28T02:32:36.853967+00:00\",\"updated_at\":\"2026-11-28T02:32:36.853967+00:00\",\"resource_key\":\"near_term:1\",\"version\":1},\"outlines\":[{\"type\":\"near_term\",\"volume_number\":1,\"chapter_start\":1,\"chapter_end\":10,\"content\":{\"arc_name\":\"锈蚀账本\",\"chapters\":[{\"title\":\"风化余烬\",\"number\":1,\"rhythm\":\"铺垫\",\"summary\":\"陈烬在缓冲区清理高辐射尸骸，因寿命贷到期被迫透支体能，意外觉醒吞噬怨念的能力，获得短暂喘息却引发剧烈头痛幻觉\",\"time_advance\":\"+1日\"},{\"title\":\"黑市契约\",\"number\":2,\"rhythm\":\"蓄力\",\"summary\":\"陈烬向红绫出售刚获取的高纯度气血石，被鬼医强行植入监测芯片并告知能力真相，被迫接受成为实验体的命运以换取延寿药物\",\"time_advance\":\"+1日\"},{\"title\":\"第一次进食\",\"number\":3,\"rhythm\":\"释放\",\"summary\":\"为验证能力可控性，陈烬主动接触一名刚死的低阶武者尸体，成功转化能量但未完全压制怨念，导致左手出现不可逆的黑斑侵蚀\",\"time_advance\":\"+2日\"},{\"title\":\"猎杀邀请\",\"number\":4,\"rhythm\":\"蓄力\",\"summary\":\"红绫提供九龙城寨深处高危异兽的情报，陈烬为偿还即将到期的巨额利息被迫接单，进入铁骨会控制区发现这是针对散修的围猎局\",\"time_advance\":\"+1日\"},{\"title\":\"铁骨围城\",\"number\":5,\"rhythm\":\"释放\",\"summary\":\"陈烬遭遇铁骨会三名通脉境打手围剿，利用狭窄地形与信号干扰器制造混乱，重伤逃脱但丢失了大部分战利品\",\"time_advance\":\"+1日\"},{\"title\":\"规则漏洞\",\"number\":6,\"rhythm\":\"铺垫\",\"summary\":\"陈烬分析战斗数据，发现铁骨会成员
